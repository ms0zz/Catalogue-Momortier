<!DOCTYPE html>

<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mon Catalogue</title>

  <style>

    body {

      font-family: Arial, sans-serif;

      margin: 0;

      padding: 20px;

      background: #f4f4f4;

      color: #222;

    }

    h1 {

      text-align: center;

    }

    .produits {

      display: grid;

      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));

      gap: 20px;

      max-width: 800px;

      margin: 25px auto;

    }

    .produit {

      background: white;

      border-radius: 12px;

      padding: 15px;

      text-align: center;

      box-shadow: 0 2px 8px #0001;

    }

    .produit img {

      width: 100%;

      height: 220px;

      object-fit: contain;

      border-radius: 8px;

    }

    .quantite {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 18px;

      margin: 15px 0;

    }

    button {

      font-size: 20px;

      padding: 6px 14px;

      cursor: pointer;

      border: 0;

      border-radius: 8px;

      background: #ddd;

    }

    .prix {

      font-size: 20px;

      font-weight: bold;

    }

    .total {

      text-align: center;

      font-size: 22px;

      font-weight: bold;

      margin: 25px auto;

    }

  </style>

</head>

<body>

  <h1>Mon Catalogue</h1>

  <div class="produits">

    <div class="produit">

      <img src="produit1.jpg.png" alt="Photo du produit 1">

      <h2>Produit 1</h2>

      <div class="quantite">

        <button onclick="changer(0, -1)">−</button>

        <span id="q0">0</span>

        <button onclick="changer(0, 1)">+</button>

      </div>

      <p class="prix" id="p0">0 €</p>

    </div>

    <div class="produit">

      <img src="produit2.jpg.png" alt="Photo du produit 2">

      <h2>Produit 2</h2>

      <div class="quantite">

        <button onclick="changer(1, -1)">−</button>

        <span id="q1">0</span>

        <button onclick="changer(1, 1)">+</button>

      </div>

      <p class="prix" id="p1">0 €</p>

    </div>

  </div>

  <div class="total">

    Total indicatif : <span id="total">0</span> €

  </div>

  <script>

    const quantites = [0, 0];

    const tarifs = [

      {0: 0, 1: 40, 2: 75, 3: 100},

      {0: 0, 1: 35, 2: 60, 3: 80}

    ];

    function prixProduit(index) {

      const q = quantites[index];

      if (q <= 3) return tarifs[index][q];

      // Au-delà de 3, le tarif n'est pas défini.

      return null;

    }

    function changer(index, variation) {

      const nouvelleQuantite = quantites[index] + variation;

      if (nouvelleQuantite < 0 || nouvelleQuantite > 3) return;

      quantites[index] = nouvelleQuantite;

      document.getElementById("q" + index).textContent = nouvelleQuantite;

      const prix = prixProduit(index);

      document.getElementById("p" + index).textContent =

        prix === null ? "Tarif à confirmer" : prix + " €";

      const total = quantites.reduce((somme, q, i) => {

        return somme + (prixProduit(i) ?? 0);

      }, 0);

      document.getElementById("total").textContent = total;

    }

  </script>

</body>

</html>
