<!DOCTYPE html>

<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mon Catalogue</title>

 <style>
  * {
    box-sizing: border-box;
  }

  html {
    -webkit-text-size-adjust: 100%;
    scroll-behavior: smooth;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 24px 16px 40px;
    background: #101010;
    color: #f7f4ed;
    line-height: 1.5;
  }

  h1 {
    text-align: center;
    color: #d8b568;
    font-size: clamp(30px, 7vw, 44px);
    letter-spacing: 3px;
    margin: 12px 0 8px;
    overflow-wrap: anywhere;
  }

  h1::after {
    content: "";
    display: block;
    width: 70px;
    height: 3px;
    background: #d8b568;
    border-radius: 3px;
    margin: 14px auto 0;
  }

  .produits {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 22px;
    width: 100%;
    max-width: 900px;
    margin: 30px auto;
  }

  .produit {
    min-width: 0;
    background: linear-gradient(145deg, #222222, #181818);
    border: 1px solid #5c4926;
    border-radius: 18px;
    padding: 18px;
    text-align: center;
    box-shadow: 0 8px 24px #0005;
    overflow: hidden;
  }

  .produit img {
    display: block;
    width: 100%;
    height: clamp(200px, 62vw, 320px);
    object-fit: contain;
    border-radius: 12px;
    margin: 0 auto 16px;
  }

  .produit h2 {
    color: #e3c47f;
    font-size: clamp(20px, 5vw, 25px);
    line-height: 1.3;
    margin: 10px 0 14px;
    overflow-wrap: anywhere;
  }

  .quantite {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 22px;
    margin: 20px 0;
  }

  button {
    min-width: 52px;
    min-height: 52px;
    padding: 10px 16px;
    font-size: 25px;
    font-weight: bold;
    color: #17130a;
    background: linear-gradient(145deg, #f0d99b, #c49a45);
    cursor: pointer;
    border: 1px solid #f0d99b;
    border-radius: 14px;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s ease, filter 0.15s ease;
  }

  button:active {
    transform: scale(0.96);
    filter: brightness(0.92);
  }

  button:focus-visible {
    outline: 3px solid #fff0bd;
    outline-offset: 3px;
  }

  .quantite span {
    min-width: 28px;
    font-size: 22px;
    font-weight: bold;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }

  .prix {
    color: #e3c47f;
    font-size: 25px;
    font-weight: bold;
    margin: 14px 0 4px;
    font-variant-numeric: tabular-nums;
  }

  .total {
    position: relative;
    text-align: center;
    width: 100%;
    max-width: 900px;
    margin: 28px auto;
    padding: 22px 16px;
    background: #201c14;
    border: 1px solid #b9954b;
    border-radius: 16px;
    color: #f5e5b9;
    font-size: clamp(21px, 5vw, 27px);
    font-weight: bold;
    overflow-wrap: anywhere;
    font-variant-numeric: tabular-nums;
  }

  @media (min-width: 700px) {
    body {
      padding: 32px 24px 50px;
    }

    .produits {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .produit {
      padding: 22px;
    }
  }

  @media (max-width: 360px) {
    body {
      padding: 18px 10px 30px;
    }

    .produit {
      padding: 13px;
    }

    .quantite {
      gap: 16px;
    }

    button {
      min-width: 48px;
      min-height: 48px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    html {
      scroll-behavior: auto;
    }

    button {
      transition: none;
    }
  }
</style>

</head>

<body>

  <h1>Mon Catalogue</h1>

  <div class="produits">

    <div class="produit">

      <img src="produit1.jpg.png" alt="Photo du produit 1">

      <h2>Gatling 108S</h2>

      <div class="quantite">

        <button onclick="changer(0, -1)">−</button>

        <span id="q0">0</span>

        <button onclick="changer(0, 1)">+</button>

      </div>

      <p class="prix" id="p0">0 €</p>

    </div>

    <div class="produit">

      <img src="produit2.jpg.png" alt="Photo du produit 2">

      <h2>Colorful eagle 105</h2>

      <div class="quantite">

        <button onclick="changer(1, -1)">−</button>

        <span id="q1">0</span>

        <button onclick="changer(1, 1)">+</button>

      </div>

      <p class="prix" id="p1">0 €</p>

    </div>

  </div>
<div class="produit">

  <img src="Gatling 4.png" alt="Gatling Shooter 4">

  <h2>Gatling Shooter 4</h2>

  <div class="quantite">

    <button onclick="changer(2, -1)">−</button>

    <span id="q2">0</span>

    <button onclick="changer(2, 1)">+</button>

  </div>

  <p class="prix" id="p2">0 €</p>

</div>
  <div class="total">

    Total indicatif : <span id="total">0</span> €

  </div>

  <script>

    const quantites = [0, 0, 0];

    const tarifs = [

      {0: 0, 1: 40, 2: 75, 3: 105},
      {0: 0, 1: 35, 2: 60, 3: 80},
      {0: 0, 1: 60, 2: 100, 3: 150}
      ];

    function prixProduit(index) {

      const q = quantites[index];

      if (q <= 3) return tarifs[index][q];

      // Au-delà de 3, le tarif n'est pas défini.

      return null;

    }

    function changer(index, variation) {

      const nouvelleQuantite = quantites[index] + variation;

      if (nouvelleQuantite < 0 || nouvelleQuantite > 3) return;

      quantites[index] = nouvelleQuantite;

      document.getElementById("q" + index).textContent = nouvelleQuantite;

      const prix = prixProduit(index);

      document.getElementById("p" + index).textContent =

        prix === null ? "Tarif à confirmer" : prix + " €";

      const total = quantites.reduce((somme, q, i) => {

        return somme + (prixProduit(i) ?? 0);

      }, 0);

      document.getElementById("total").textContent = total;

    }

  </script>

</body>

</html>
